# 一键起服务 + 官网：docker compose up -d --build
#   http://<host>:<HOST_PORT>/        官网（前端构建产物由 Go 静态托管）
#   http://<host>:<HOST_PORT>/api/v1/ 更新服务接口
#
# app 单独起：MySQL 已由独立栈 /root/SharedMySQL 统一提供（接入其 external 网络
# shared_mysql，服务别名 mysql）。
# 本文件不再自带 mysql 服务；数据在原 server_mysql-data 卷里留作回滚。
#
# 库名/账号/密码仍复用 .env 的 DB_* 配置，容器内 app 用服务名 mysql 连库。
#
# 改用外部数据库（如阿里云 RDS）时：在 .env 里设 COMPOSE_DB_HOST=<RDS 地址>，
# 并只起 app：docker compose up -d --no-deps app
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 官网与接口同源（Go 直接托管前端产物），这两个参数通常不用改：
        #   VITE_APP_KEY        —— 与上传 workflow 的 appKey 一致
        #   VITE_API_BASE_URL   —— 留空 = 请求同源 /api；只有官网单独部署到别的域名时才需要填
        VITE_APP_KEY: ${VITE_APP_KEY:-schedule}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    container_name: schedule-server
    restart: unless-stopped
    ports:
      # 宿主暴露端口（.env 的 HOST_PORT），容器内固定 8080
      - "${HOST_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      # 容器内监听固定 8080，避免和宿主映射端口混淆
      SERVER_PORT: "8080"
      # 显式指定前端产物目录（优先于 env_file，防止 .env 里的空值把镜像 ENV 覆盖掉）
      WEB_DIR: ${WEB_DIR:-/app/web}
      TZ: ${TZ:-Asia/Shanghai}
      # environment 优先级高于 env_file，这里把数据源指向 compose 内的 mysql 服务
      DB_HOST: ${COMPOSE_DB_HOST:-mysql}
      DB_PORT: ${COMPOSE_DB_PORT:-3306}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
    # 接入共享主库栈的网络后，DB_HOST=mysql 解析到 /root/SharedMySQL 的 mysql 服务
    networks:
      - default
      - shared_mysql

networks:
  # 由 /root/SharedMySQL 栈创建，本项目只做 external 接入
  shared_mysql:
    external: true
